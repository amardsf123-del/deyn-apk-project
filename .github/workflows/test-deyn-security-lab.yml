name: Test DEYN security lab

on:
  push:
    branches: [security-v2-lab, cloud-sync-lab]
    paths:
      - "security-lab/**"
      - "firebase.cloud-sync.json"
      - ".github/workflows/test-deyn-security-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find security-lab -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Install cloud membership backend dependencies
        run: npm install --prefix security-lab/cloud-sync/functions
      - name: Report dependency advisories for backend prototype
        run: |
          set -euo pipefail
          npm audit --prefix security-lab/cloud-sync/functions --json > "$RUNNER_TEMP/deyn-functions-audit.json" || true
          node -e '
            const a = require(process.env.RUNNER_TEMP + "/deyn-functions-audit.json");
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              process.stdout.write(JSON.stringify({
                package: name, severity: v.severity, direct: v.isDirect,
                range: v.range, fixAvailable: v.fixAvailable,
                advisories: (v.via || []).map(x => typeof x === "string" ? x : {title: x.title, url: x.url, range: x.range})
              }) + "\n");
            }
          '
      - name: Check Capacitor 8 Firebase bridge dependency compatibility
        run: |
          set -euo pipefail
          npm install --prefix security-lab/cloud-sync/capacitor8-bridge-test
          npm ls --prefix security-lab/cloud-sync/capacitor8-bridge-test --depth=0
      - name: Report dependency advisories for Capacitor bridge prototype
        run: |
          set -euo pipefail
          npm audit --prefix security-lab/cloud-sync/capacitor8-bridge-test --json > "$RUNNER_TEMP/deyn-bridge-audit.json" || true
          node -e '
            const a = require(process.env.RUNNER_TEMP + "/deyn-bridge-audit.json");
            for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
              process.stdout.write(JSON.stringify({
                package: name, severity: v.severity, direct: v.isDirect,
                range: v.range, fixAvailable: v.fixAvailable
              }) + "\n");
            }
          '
      - name: Run security prototype tests
        run: |
          set -euo pipefail
          mapfile -t tests < <(find security-lab -type d -name node_modules -prune -o -type f -path '*/test/*.test.js' ! -path '*/cloud-sync/functions/test/*' -print | sort)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase emulator test dependencies
        run: npm install --prefix security-lab/cloud-sync/emulator-tests
      - name: Test Firestore rules and membership transactions in the Firebase Emulator
        run: |
          set -euo pipefail
          ./security-lab/cloud-sync/emulator-tests/node_modules/.bin/firebase emulators:exec \
            --config firebase.cloud-sync.json \
            --project demo-deyn-sync \
            --only firestore \
            "npm --prefix security-lab/cloud-sync/emulator-tests run test:rules && npm --prefix security-lab/cloud-sync/functions test"
