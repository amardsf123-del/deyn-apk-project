name: Test DEYN security lab

on:
  push:
    branches: [security-v2-lab]
    paths:
      - "security-lab/**"
      - ".github/workflows/test-deyn-security-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find security-lab -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Run security prototype tests
        run: |
          set -euo pipefail
          mapfile -t tests < <(find security-lab -type f -path '*/test/*.test.js' | sort)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"
