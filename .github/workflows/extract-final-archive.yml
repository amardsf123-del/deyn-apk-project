name: Extract uploaded DEYN final archive into repository root

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-final-archive.yml'

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract exact uploaded archive into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -s deyn-apk-project-final.zip
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path("deyn-apk-project-final.zip")
          with ZipFile(archive) as z:
              members = [i for i in z.infolist() if not i.is_dir()]
              for info in members:
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  target = Path(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          print(f"Extracted {len(members)} files from {archive}")
          PY
          test -s deyn-app/www/index.html
          test -s deyn-app/native/DeynSmsPlugin.java
          test -s cloudflare-sync/wrangler.toml
          test -s cloudflare-sync/package.json
          test -s cloudflare-sync/src/index.js
          rm .github/workflows/extract-final-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract uploaded DEYN final project archive"
          git push origin HEAD:main
