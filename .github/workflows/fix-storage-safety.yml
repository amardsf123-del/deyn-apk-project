name: DEYN storage safety patch and Android test build

on:
  push:
    branches: [fix/storage-safety-2026-11]
    paths:
      - 'scripts/apply-storage-safety.py'
      - '.github/workflows/fix-storage-safety.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/storage-safety-2026-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Apply guarded source patch and syntax checks
        run: python scripts/apply-storage-safety.py
      - name: Commit updated application archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deyn-apk-project.zip
          if ! git diff --cached --quiet; then
            git commit -m "Protect DEYN local data from silent storage failures"
            git push
          fi
      - name: Build DEYN and key generator debug APKs
        shell: bash
        run: |
          set -euo pipefail
          unzip -q deyn-apk-project.zip -d source
          for app in deyn-app deyn-keygen; do
            pushd "source/$app"
            npm install
            python3 scripts/fetch_fonts.py
            npx cap add android
            bash scripts/prepare-android.sh
            npx cap sync android
            (cd android && ./gradlew assembleDebug)
            popd
          done
      - name: Upload Android debug APKs for testing only
        uses: actions/upload-artifact@v4
        with:
          name: DEYN-storage-safety-debug-apks
          path: |
            source/deyn-app/android/app/build/outputs/apk/debug/*.apk
            source/deyn-keygen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
