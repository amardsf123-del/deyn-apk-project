name: Deploy DEYN cloud sync backend

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type DEPLOY to authorize deployment to the configured Firebase project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deyn-cloud-sync-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: deyn-cloud-sync-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud-sync-lab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required deployment secrets
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
      - name: Install backend dependencies and Firebase CLI
        run: |
          set -euo pipefail
          npm install --prefix security-lab/cloud-sync/functions
          npm install --global firebase-tools@14
      - name: Authenticate and deploy Cloud Functions and Firestore rules
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --config firebase.cloud-sync.json \
            --only functions,firestore:rules \
            --non-interactive
