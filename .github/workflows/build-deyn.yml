name: Build DEYN APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deyn-apk-project.zip'
      - '.github/build-now.txt'
      - '.github/workflows/build-deyn.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [deyn-app, deyn-keygen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extract project archive
        run: |
          set -euo pipefail
          test -s deyn-apk-project.zip
          unzip -q deyn-apk-project.zip -d source
          echo "Archive top-level entries:"
          find source -mindepth 1 -maxdepth 3 -print | sort | head -160
      - name: Locate application directory
        run: |
          set -euo pipefail
          echo "Available package.json files:"
          find source -type f -name package.json -print | sort
          manifest="$(find source -type f -path "*/${{ matrix.app }}/package.json" -print -quit)"
          if [ -z "$manifest" ]; then
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
            echo "::warning::${{ matrix.app }} is not present in this archive; skipping this target."
            exit 0
          fi
          echo "APP_DIR=$(dirname "$manifest")" >> "$GITHUB_ENV"
          echo "Building from $(dirname "$manifest")"
      - name: Build APK
        if: env.SKIP_BUILD != 'true'
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm install
          python3 scripts/fetch_fonts.py
          npx cap add android
          bash scripts/prepare-android.sh
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      - name: Upload debug APK for testing only
        if: env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
