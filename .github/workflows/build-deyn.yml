name: Build DEYN APKs

on:
  workflow_dispatch:
  push:
    branches: [sms-integration-files]
    paths:
      - '.github/workflows/build-deyn.yml'
      - 'factory-recovery.patch'
      - 'splash-lock.patch'
      - 'PRO_4-fixed.zip'
      - 'deyn-apk-project.zip'
      - '.github/build-now.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [deyn-app, deyn-keygen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract the exact uploaded PRO 4 source and app archive
        shell: bash
        run: |
          set -euo pipefail
          test -s PRO_4-fixed.zip
          test -s deyn-apk-project.zip
          mkdir -p pro4 source
          unzip -q PRO_4-fixed.zip -d pro4
          unzip -q deyn-apk-project.zip -d source
          test -s pro4/PRO_4/.github/scripts/integrate_sms.py
          test -s pro4/PRO_4/sms/engine.js
          test -s pro4/PRO_4/DeynSmsPlugin.java
          test -s source/deyn-app/www/index.html
          test -s source/deyn-keygen/www/index.html
          echo "PRO_4-fixed.zip SHA256:"
          sha256sum PRO_4-fixed.zip
          echo "deyn-apk-project.zip SHA256:"
          sha256sum deyn-apk-project.zip
      - name: Integrate PRO 4 SMS, French localization, backup and clock completion
        if: matrix.app == 'deyn-app'
        shell: bash
        run: |
          set -euo pipefail
          python3 pro4/PRO_4/.github/scripts/integrate_sms.py source pro4/PRO_4/sms/engine.js pro4/PRO_4/DeynSmsPlugin.java
          patch --batch --forward -p1 < factory-recovery.patch
          patch --batch --forward -p1 < splash-lock.patch
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('source/deyn-app/www/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script\s*>', html, re.I)
          for i, script in enumerate(scripts):
              if script.strip():
                  p = Path(tempfile.gettempdir()) / f'deyn-{i}.js'
                  p.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(p)], check=True)
          # Regression guards for the two reported password/startup defects.
          import hashlib
          expected_factory_hash = 'd3b8c687b5010a58aadc07d27ea2bbafb2671f1b903f81e61d4bd7f5258ccd26'
          assert hashlib.sha256(b'TAYBEIAOMAR').hexdigest() == expected_factory_hash
          assert f"FACTORY_RECOVERY_SHA256 = '{expected_factory_hash}'" in html
          assert 'factoryRecoverySubmit: () => submitFactoryRecovery()' in html
          assert "'factoryRecoverySubmit'" in html
          assert 'if (isWorkerDevice()) return toast(' in html
          assert 'S.auth.pwMustSet = true;' in html
          assert '<body class="booting">' in html
          assert '<div class="shell" id="appShell" hidden>' in html
          assert 'body.booting .shell{visibility:hidden!important}' in html
          init_at = html.index('async function init()')
          order = [
              html.index('const changed = await authMigrate();', init_at),
              html.index('checkAppLock();', init_at),
              html.index('ensurePasswordSet();', init_at),
              html.index('shell.hidden = false;', init_at),
              html.index("document.body.classList.remove('booting');", init_at),
          ]
          assert order == sorted(order), 'App shell is revealed before the lock check.'
          factory_at = html.index('async function submitFactoryRecovery()')
          recovery_at = html.index('async function submitRecovery()', factory_at)
          factory_code = html[factory_at:recovery_at]
          assert 'delete S.auth.pw;' in factory_code
          assert 'S.auth.pwMustSet = true;' in factory_code
          assert 'S.auth.licRole' not in factory_code
          assert 'S.settings' not in factory_code
          print('Factory recovery and startup-lock regression checks passed.')
          print(f'Validated {len(scripts)} inline JavaScript blocks.')
          PY
          node pro4/PRO_4/sms/test.mjs | tee sms-unit-tests.log
          node source/trusted-time/test.mjs | tee trusted-time-tests.log
          node source/sync/test_engine.mjs | tee sync-engine-tests.log
          node source/sync/test_session.mjs | tee sync-session-tests.log
          (cd pro4/PRO_4/tests/android-sim && bash run.sh) | tee native-sms-simulation.log
      - name: Build APK
        working-directory: source/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          npm install
          python3 scripts/fetch_fonts.py
          npx cap add android
          bash scripts/prepare-android.sh
          npx cap sync android
          if [ "${{ matrix.app }}" = "deyn-app" ]; then
            for P in DeynVaultPlugin.java DeynSyncPlugin.java DeynSmsPlugin.java DeynBackupPlugin.java DeynNotifPlugin.java; do
              test -s "android/app/src/main/java/com/deyn/app/$P"
            done
          fi
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK for testing only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: source/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
