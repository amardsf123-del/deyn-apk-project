name: Build DEYN from PRO_4-fixed.zip only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PRO_4-fixed.zip'
      - '.github/workflows/build-deyn.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [deyn-app, deyn-keygen]
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract ONLY the uploaded PRO_4-fixed.zip
        shell: bash
        run: |
          set -euo pipefail
          test -s PRO_4-fixed.zip || { echo "::error::PRO_4-fixed.zip is missing"; exit 1; }
          echo "Input archive: PRO_4-fixed.zip"
          sha256sum PRO_4-fixed.zip
          mkdir -p source
          unzip -q PRO_4-fixed.zip -d source
          PROJECT_ROOT="$(find source -mindepth 1 -maxdepth 4 -type d -name PRO_4 -print -quit)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::PRO_4 directory not found inside PRO_4-fixed.zip"
            find source -maxdepth 5 -name package.json -print
            exit 1
          fi
          test -s "$PROJECT_ROOT/${{ matrix.app }}/package.json" || { echo "::error::${{ matrix.app }}/package.json missing in uploaded archive"; exit 1; }
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Verified build source: $PROJECT_ROOT/${{ matrix.app }}"
          find "$PROJECT_ROOT/${{ matrix.app }}" -maxdepth 2 -type f | sort | head -200

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK from uploaded archive source without overlays
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="$PROJECT_ROOT/${{ matrix.app }}"
          cd "$APP_DIR"
          npm install
          if [ -f scripts/fetch_fonts.py ]; then python3 scripts/fetch_fonts.py; fi
          npx cap add android
          if [ -f scripts/prepare-android.sh ]; then bash scripts/prepare-android.sh; fi
          npx cap sync android
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK built from PRO_4-fixed.zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-PRO_4-fixed-debug-apk
          path: ${{ env.PROJECT_ROOT }}/${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
