name: DEYN SMS integration - debug test only

on:
  push:
    branches: [sms-integration-files]
    paths:
      - '.github/workflows/build-sms-test.yml'
      - '.github/scripts/integrate_sms.py'
      - 'sms-feature.patch'
      - 'DeynSmsPlugin.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract the real project archive
        shell: bash
        run: |
          set -euo pipefail
          test -s deyn-apk-project.zip
          test -s sms-feature.patch
          test -s DeynSmsPlugin.java
          mkdir source
          unzip -q deyn-apk-project.zip -d source
      - name: Integrate SMS into real Capacitor source (never preview)
        run: python3 .github/scripts/integrate_sms.py source sms-feature.patch DeynSmsPlugin.java
      - name: Verify HTML JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('source/deyn-app/www/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script\s*>', html, re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              p = Path(tempfile.gettempdir()) / f'deyn-inline-{i}.js'
              p.write_text(script, encoding='utf-8')
              subprocess.run(['node', '--check', str(p)], check=True)
          print(f'Checked {len(scripts)} inline script blocks')
          PY
      - name: Install Chromium for browser security tests
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run DEYN unit and security tests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node trusted-time/test.mjs
          node sync/test_engine.mjs
          node sync/test_session.mjs
          python3 -m unittest discover -s tests/e2e -v
      - name: Install app dependencies and Android platform
        working-directory: source/deyn-app
        run: |
          npm install
          python3 scripts/fetch_fonts.py
          npx cap add android
          bash scripts/prepare-android.sh
          npx cap sync android
      - name: Build unsigned debug APK
        working-directory: source/deyn-app/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload APK for owner testing only
        uses: actions/upload-artifact@v4
        with:
          name: deyn-sms-debug-test-only
          path: source/deyn-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
