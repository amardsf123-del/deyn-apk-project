name: Test DEYN Ouisync POC

on:
  push:
    branches: [ouisync-poc]
    paths:
      - "security-lab/ouisync-poc/**"
      - ".github/workflows/test-ouisync-poc.yml"
  pull_request:
    branches: [cloud-sync-lab]
    paths:
      - "security-lab/ouisync-poc/**"
      - ".github/workflows/test-ouisync-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build isolated debug APK
        working-directory: security-lab/ouisync-poc
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Report APK size and SHA-256
        working-directory: security-lab/ouisync-poc
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Upload POC APK
        uses: actions/upload-artifact@v4
        with:
          name: deyn-ouisync-poc-debug-apk
          path: security-lab/ouisync-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
