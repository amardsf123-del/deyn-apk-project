name: Build DEYN v3 keygen test APK

on:
  push:
    branches: [security-v2-lab]
    paths:
      - "security-lab/licensing-v3/keygen-v3-app/**"
      - "security-lab/licensing-v3/license-v3.js"
      - ".github/workflows/build-deyn-v3-keygen-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Confirm preinstalled Android SDK
        run: |
          SDK_PATH="\u0024{ANDROID_SDK_ROOT:-\u0024{ANDROID_HOME:-}}"
          test -n "\u0024SDK_PATH"
          echo "ANDROID_HOME=\u0024SDK_PATH" >> "\u0024GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=\u0024SDK_PATH" >> "\u0024GITHUB_ENV"
          test -d "\u0024SDK_PATH/platforms"
      - name: Install Capacitor dependencies
        working-directory: security-lab/licensing-v3/keygen-v3-app
        run: npm install --no-audit --no-fund
      - name: Copy shared DEYN3 signer into web assets
        working-directory: security-lab/licensing-v3/keygen-v3-app
        run: npm run prepare-keygen
      - name: Generate Android project
        working-directory: security-lab/licensing-v3/keygen-v3-app
        run: npx cap add android
      - name: Sync Android project
        working-directory: security-lab/licensing-v3/keygen-v3-app
        run: npx cap sync android && bash scripts/prepare-android.sh
      - name: Build debug APK
        working-directory: security-lab/licensing-v3/keygen-v3-app/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: deyn-keygen-v3-test-apk
          path: security-lab/licensing-v3/keygen-v3-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
