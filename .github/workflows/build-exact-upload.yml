name: Build exact uploaded DEYN archive

on:
  push:
    branches: [deyn-exact-upload-build-20261117]
    paths:
      - '.github/workflows/build-exact-upload.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [deyn-app, deyn-keygen]
    steps:
      - uses: actions/checkout@v4
      - name: Verify the exact user-uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          test -s 'deyn-apk-project-fixed (1).zip'
          actual="$(git hash-object 'deyn-apk-project-fixed (1).zip')"
          echo "Uploaded archive Git blob SHA: $actual"
          test "$actual" = '2c6351d0446d326ea5cb3cd108699290398ec41c'
          echo 'Verified: building only deyn-apk-project-fixed (1).zip from the exact uploaded revision.'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract the uploaded archive without source patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deyn-exact-source"
          unzip -q 'deyn-apk-project-fixed (1).zip' -d "$RUNNER_TEMP/deyn-exact-source"
          app_dir="$(find "$RUNNER_TEMP/deyn-exact-source" -type d -name '${{ matrix.app }}' -print -quit)"
          test -n "$app_dir"
          test -s "$app_dir/package.json"
          test -s "$app_dir/www/index.html"
          echo "Building source directory: $app_dir"
          echo "$app_dir" > "$RUNNER_TEMP/deyn-app-dir.txt"
      - name: Build APK from uploaded source
        shell: bash
        run: |
          set -euo pipefail
          app_dir="$(cat "$RUNNER_TEMP/deyn-app-dir.txt")"
          cd "$app_dir"
          npm install
          if [ -f scripts/fetch_fonts.py ]; then python3 scripts/fetch_fonts.py; fi
          if [ ! -d android ]; then npx cap add android; fi
          if [ -f scripts/prepare-android.sh ]; then bash scripts/prepare-android.sh; fi
          npx cap sync android
          cd android
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload the built APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-exact-upload-debug-apk
          path: ${{ runner.temp }}/deyn-placeholder-never-used
          if-no-files-found: ignore
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-exact-upload-apk
          path: ${{ runner.temp }}/deyn-placeholder-never-used
          if-no-files-found: ignore